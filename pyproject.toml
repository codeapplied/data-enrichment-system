[project]
name = "data-enrichment-system"
version = "0.1.0"
description = "Confidence-gated pipeline: resolve organization identity, discover web domains, and enrich decision-maker contacts."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dataenrich = "dataenrich.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataenrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
