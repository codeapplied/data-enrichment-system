# Copy this file to config/rules.yaml and configure your own values.
#
# department_priority re-ranks enrichment results by function relevance
# instead of trusting the enrichment vendor's default seniority-first sort.
# List departments/functions in the order that actually matters for your
# buyer, most relevant first — the default order below is a placeholder,
# not a recommendation.
department_priority:
  - development
  - construction
  - property-management
  - operations
  - executive

# exclude_domains / exclude_domain_keywords: a living blocklist of domains
# and generic tokens that repeatedly produce false-positive domain matches
# (listing aggregators, directories, news sites, government portals,
# overly generic single-word tokens). Expected to grow from real false
# positives observed during use — not meant to be exhaustive on day one.
exclude_domains: []
exclude_domain_keywords: []
